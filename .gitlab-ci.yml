stages:
  - build

variables:
  HADOOP_VERSION: "3.4.1"

build:
  stage: build
  tags:
    - docker
  image: docker:28
  script:
    - apk add --no-cache bash
    - ./start-build-env.sh ubuntu_20 mvn package -Pdist,native -DskipTests -Dtar
  artifacts:
    paths:
      - hadoop-dist/target/hadoop-3.4.1.tar.gz
    expire_in: 1 day
